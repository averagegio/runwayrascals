<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container map-select-bg auth-screen">
            <div class="page-nav">
                <a href="index.html" class="game-btn back-btn"><span class="btn-text">Home</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Runway Rascals</h1>
                <p class="map-subtitle">Log in to your model account</p>
            </div>
            <form id="loginForm" class="auth-form">
                <label>Email<input type="email" id="email" required autocomplete="email" placeholder="you@email.com"></label>
                <label>Password<input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"></label>
                <p id="authError" class="auth-error" hidden></p>
                <button type="submit" class="game-btn confirm-btn auth-submit"><span class="btn-text">Log In</span></button>
            </form>
            <div class="game-footer auth-footer">
                <a href="signup.html" class="game-btn"><span class="btn-text">Sign Up</span></a>
                <a href="index.html" class="game-btn back-btn"><span class="btn-text">Home</span></a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('authError');
            err.hidden = true;
            try {
                await RunwayAuth.login({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                window.location.href = new URLSearchParams(location.search).get('next') || 'index.html';
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            }
        });
    </script>
</body>
</html>
