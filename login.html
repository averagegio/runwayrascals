<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runway Rascals — Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container map-select-bg auth-screen">
            <div class="game-header">
                <h1 class="game-title">Runway Rascals</h1>
                <p class="map-subtitle">Log in to your model account</p>
            </div>
            <form id="loginForm" class="auth-form">
                <label>Email<input type="email" id="email" required autocomplete="email" placeholder="you@email.com"></label>
                <label>Password<input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"></label>
                <p id="authError" class="auth-error" hidden></p>
                <button type="submit" class="game-btn confirm-btn auth-submit"><span class="btn-text">Log In</span></button>
            </form>
            <div class="game-footer auth-footer">
                <a href="signup.html" class="game-btn"><span class="btn-text">Sign Up</span></a>
                <a href="index.html" class="game-btn back-btn"><span class="btn-text">Home</span></a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('authError');
            err.hidden = true;
            try {
                await RunwayAuth.login({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                window.location.href = 'index.html';
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            }
        });
    </script>
</body>
</html>
