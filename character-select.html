<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals - Character Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container character-select-bg">
            <div class="page-nav">
                <a href="index.html" class="game-btn back-btn"><span class="btn-text">Home</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Select Character</h1>
                <p class="map-subtitle" id="charSubtitle">Name your look</p>
            </div>
            <div class="character-selection">
                <div class="character-options">
                    <div class="character-option" data-character="male">
                        <img src="chibibrodoll.png" alt="Devil Boy">
                        <p>Devil Boy</p>
                    </div>
                    <div class="character-option" data-character="female">
                        <img src="chibidoll2.png" alt="Mouse Girl">
                        <p>Mouse Girl</p>
                    </div>
                    <div class="character-option" data-character="fashion">
                        <img src="chibidollfashion.png" alt="Fashion Doll">
                        <p>Fashion Doll</p>
                    </div>
                    <div class="character-option" data-character="evening">
                        <img src="chibidoll3.png" alt="Evening Doll">
                        <p>Evening Doll</p>
                    </div>
                </div>
            </div>
            <div class="game-footer">
                <a href="index.html" class="game-btn back-btn">
                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmCharacterBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Confirm</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script src="character-select.js"></script>
</body>
</html>
