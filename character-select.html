<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals - Character Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container character-select-bg">
            <div class="page-nav">
                <a href="index.html" class="game-btn back-btn"><span class="btn-text">Home</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Pick Your Model</h1>
                <p class="map-subtitle" id="charSubtitle">Styled cast · tap a look</p>
            </div>
            <div class="character-selection cast-grid-wrap">
                <div class="character-options cast-grid">
                    <button type="button" class="character-option cast-card" data-character="male">
                        <span class="cast-frame"><img src="chibibrodoll.png" alt="Devil Boy"></span>
                        <span class="cast-name">Devil Boy</span>
                        <span class="cast-tag">Street heat</span>
                    </button>
                    <button type="button" class="character-option cast-card" data-character="female">
                        <span class="cast-frame"><img src="chibidoll2.png" alt="Mouse Girl"></span>
                        <span class="cast-name">Mouse Girl</span>
                        <span class="cast-tag">Cute couture</span>
                    </button>
                    <button type="button" class="character-option cast-card" data-character="fashion">
                        <span class="cast-frame"><img src="chibidollfashion.png" alt="Fashion Doll"></span>
                        <span class="cast-name">Fashion Doll</span>
                        <span class="cast-tag">Front row</span>
                    </button>
                    <button type="button" class="character-option cast-card" data-character="evening">
                        <span class="cast-frame"><img src="chibidoll3.png" alt="Evening Doll"></span>
                        <span class="cast-name">Evening Doll</span>
                        <span class="cast-tag">After dark</span>
                    </button>
                </div>
            </div>
            <div class="game-footer">
                <a href="index.html" class="game-btn back-btn">
                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmCharacterBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Confirm</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script src="character-select.js"></script>
</body>
</html>
