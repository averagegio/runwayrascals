<!DOCTYPE html>
<html lang="en">
<head>

    <title>Runway Rascals - Fashion Week Maps</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<body>

                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmMapBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Hit the Runway</span>
                    <span class="btn-shine"></span>

        </div>
    </div>
    <script src="auth-client.js"></script>
    <script src="map-select.js"></script>
