<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals - Fashion Week Maps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container map-select-bg">
            <div class="page-nav">
                <a href="wardrobe-select.html" class="game-btn back-btn"><span class="btn-text">Back</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Fashion Week</h1>
                <p class="map-subtitle">Pick your runway</p>
            </div>
            <div class="map-selection" id="mapList">
                <!-- Maps injected by map-select.js -->
            </div>
            <div class="game-footer">
                <a href="wardrobe-select.html" class="game-btn back-btn">
                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmMapBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Hit the Runway</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script src="map-select.js"></script>
</body>
</html>
