<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Checkout — Rascal Runways</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container map-select-bg auth-screen">
            <div class="page-nav">
                <a href="store.html" class="game-btn back-btn"><span class="btn-text">Boutique</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Checkout</h1>
                <p class="map-subtitle">Confirm to add this look to your closet</p>
            </div>
            <div class="auth-form">
                <p id="itemName" class="hud-outfit" style="text-align:center;font-size:18px;"></p>
                <p id="itemPrice" class="map-subtitle" style="text-align:center;"></p>
                <p class="auth-hint">Secure member checkout for Rascal Runways looks.</p>
                <p id="authError" class="auth-error" hidden></p>
                <button id="confirmBtn" class="game-btn confirm-btn auth-submit"><span class="btn-text">Confirm purchase</span></button>
                <a href="store.html" class="game-btn" style="text-align:center;margin-top:10px;"><span class="btn-text">Cancel</span></a>
            </div>
        </div>
    </div>
    <script src="auth-client.js"></script>
    <script>
        if (!RunwayAuth.requireAuth()) { /* redirect */ }
        const params = new URLSearchParams(location.search);
        const itemId = params.get('item');
        const name = params.get('name') || itemId;
        const price = Number(params.get('price') || 0);
        document.getElementById('itemName').textContent = name;
        document.getElementById('itemPrice').textContent = `$${(price / 100).toFixed(2)} USD`;
        document.getElementById('confirmBtn').addEventListener('click', async () => {
            const err = document.getElementById('authError');
            err.hidden = true;
            try {
                await RunwayAuth.api('/api/store/confirm-checkout', {
                    method: 'POST',
                    body: JSON.stringify({ itemId })
                });
                location.href = `store.html?success=1&item=${encodeURIComponent(itemId)}`;
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            }
        });
    </script>
</body>
</html>
