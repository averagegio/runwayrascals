<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Runway Rascals" />
  <meta name="theme-color" content="#070708" />
  <title>Runway Rascals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="intro-splash" id="introSplash" aria-hidden="false">
    <div class="intro-mark">
      <div class="intro-write-stage" id="introWriteStage">
        <!-- Cursive RR: first R, shoelace loop, second R askew -->
        <svg id="rrMonogramSvg" class="intro-rr-svg" viewBox="0 0 320 220" aria-label="RR">
          <defs>
            <linearGradient id="rrStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f4efe6" />
              <stop offset="55%" stop-color="#e8d5a8" />
              <stop offset="100%" stop-color="#c9a56a" />
            </linearGradient>
          </defs>
          <!-- First cursive R (upright) -->
          <path id="rrPathL" class="rr-stroke" fill="none" stroke="url(#rrStrokeGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
            d="M 52 178
               C 48 140, 46 78, 54 42
               C 58 24, 78 16, 98 22
               C 128 30, 142 58, 132 84
               C 122 110, 92 118, 68 112
               C 68 112, 96 118, 118 148
               C 132 168, 148 182, 168 188" />
          <!-- Shoelace tie flourish between the Rs -->
          <path id="rrPathLace" class="rr-stroke rr-lace" fill="none" stroke="url(#rrStrokeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
            d="M 168 188
               C 188 198, 210 186, 208 164
               C 206 142, 178 138, 172 156
               C 166 174, 188 192, 214 176
               C 236 162, 242 140, 228 128" />
          <!-- Second cursive R — askew -->
          <g transform="translate(198,18) rotate(-16 70 100)">
            <path id="rrPathR" class="rr-stroke" fill="none" stroke="url(#rrStrokeGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
              d="M 36 172
                 C 34 132, 32 72, 42 38
                 C 48 18, 72 10, 94 20
                 C 124 32, 136 62, 124 88
                 C 112 114, 82 120, 58 112
                 C 58 112, 88 122, 112 154
                 C 126 174, 140 186, 158 190" />
          </g>
        </svg>
        <div class="intro-pen" id="introPen" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <path fill="#3b2f2a" d="M44 6c-2-2-6-2-9 1L8 34l-3 14 14-3 27-27c3-3 3-7 0-10z"/>
            <path fill="#c9a56a" d="M42 8l6 6-4 4-6-6z"/>
            <path fill="#f4efe6" d="M10 40l6 6-8 2z"/>
            <path fill="#8b6914" d="M46 4c4 1 8 6 8 10 0 0-6-2-10-6 1-2 1-3 2-4z"/>
            <path fill="#d4a574" d="M52 8c2 3 3 6 2 9-3-2-6-5-8-8 2-1 4-1 6-1z"/>
          </svg>
        </div>
      </div>
      <p class="intro-rule" aria-hidden="true"></p>
      <p class="brand">Runway Rascals</p>
      <p class="sub">Fashion endless runner</p>
      <button type="button" class="intro-swipe-hint" id="introSwipeHint" aria-label="Swipe up to enter">
        <span class="intro-swipe-chevron" aria-hidden="true"></span>
        <span>Swipe up</span>
      </button>
    </div>
  </div>

  <div class="phone-frame">
    <div class="app-container home-shell" id="home-screen">
      <div class="page-nav">
        <span class="page-nav-spacer" aria-hidden="true"></span>
        <a class="game-btn" id="loginLink" href="login.html"><span class="btn-text">Account</span></a>
        <button type="button" class="game-btn" id="logoutBtn" hidden><span class="btn-text">Sign out</span></button>
      </div>

      <div class="game-header">
        <h1 class="game-title">Runway<br />Rascals</h1>
        <p class="map-subtitle" id="homeTagline">Race the runway. Dodge paparazzi. Dress the look.</p>
        <div class="home-profile" id="homeProfile" hidden>
          <p class="home-name" id="homeName"></p>
          <p class="home-tag" id="homeTag"></p>
        </div>
        <div class="home-cta-row">
          <a class="game-btn confirm-btn enter-game-btn" id="enterGameBtn" href="character-select.html"><span class="btn-text">Play</span></a>
          <a class="game-btn" id="signupLink" href="signup.html"><span class="btn-text">Sign up</span></a>
          <a class="game-btn" id="storeLink" href="store.html" hidden><span class="btn-text">Boutique</span></a>
          <a class="game-btn" id="profileLink" href="profile-setup.html" hidden><span class="btn-text">Profile</span></a>
          <a class="game-btn" id="customizeLink" href="wardrobe-select.html" hidden><span class="btn-text">Wardrobe</span></a>
        </div>
      </div>

      <div class="home-hero-spacer" aria-hidden="true"></div>

      <div class="game-footer home-actions">
        <a class="game-btn" href="map-select.html"><span class="btn-text">Fashion Week</span></a>
      </div>
    </div>
  </div>

  <script src="auth-client.js"></script>
  <script src="script.js"></script>
  <script src="intro.js"></script>
</body>
</html>
