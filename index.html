<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rascal Runways" />
  <meta name="theme-color" content="#070708" />
  <title>Rascal Runways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="intro-splash" id="introSplash" aria-hidden="false">
    <div class="intro-bg" id="introBg" aria-hidden="true">
      <div class="home-bg-wash"></div>
      <div class="home-bg-runway"></div>
      <div class="home-bg-beams"></div>
      <div class="home-bg-grain"></div>
    </div>
    <div class="intro-swipe-veil" id="introSwipeVeil" aria-hidden="true"></div>
    <div class="intro-mark">
      <div class="intro-rr" id="introRR" aria-label="RR">
        <span class="intro-r intro-r--left">R</span>
        <span class="intro-r intro-r--right">R</span>
        <span class="intro-rr-glass" aria-hidden="true"></span>
      </div>
      <p class="intro-rule" aria-hidden="true"></p>
      <p class="brand">Rascal Runways</p>
      <p class="sub">Fashion endless runner</p>
    </div>
    <button type="button" class="intro-swipe-hint" id="introSwipeHint" aria-label="Swipe up to enter">
      <span class="intro-swipe-chevron" aria-hidden="true"></span>
      <span>Swipe up</span>
    </button>
  </div>

  <div class="phone-frame">
    <div class="app-container home-shell" id="home-screen">
      <div class="home-bg" aria-hidden="true">
        <div class="home-bg-wash"></div>
        <div class="home-bg-runway"></div>
        <div class="home-bg-beams"></div>
        <div class="home-bg-grain"></div>
      </div>

      <div class="page-nav home-top-nav">
        <button
          type="button"
          class="menu-toggle"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="homeDrawer"
        >
          <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>
      </div>

      <div class="game-header">
        <h1 class="game-title">Rascal<br />Runways</h1>
        <p class="map-subtitle" id="homeTagline">Race the runway. Dodge paparazzi. Dress the look.</p>
        <div class="home-profile" id="homeProfile" hidden>
          <p class="home-name" id="homeName"></p>
          <p class="home-tag" id="homeTag"></p>
        </div>
        <div class="home-cta-row home-cta-linear">
          <a class="game-btn confirm-btn enter-game-btn" id="enterGameBtn" href="character-select.html"><span class="btn-text">Play</span></a>
          <button type="button" class="game-btn confirm-btn" id="quickRunBtn"><span class="btn-text">Quick Run</span></button>
          <a class="game-btn confirm-btn" id="robloxPlayLink" href="roblox.html"><span class="btn-text">Play on Roblox</span></a>
          <a class="game-btn" id="signupLink" href="signup.html"><span class="btn-text">Sign up</span></a>
          <a class="game-btn" id="wardrobeLink" href="wardrobe-select.html"><span class="btn-text">Wardrobe</span></a>
          <a class="game-btn" id="fashionWeekLink" href="map-select.html"><span class="btn-text">Fashion Week</span></a>
        </div>
      </div>

      <div class="home-hero-spacer" aria-hidden="true"></div>
    </div>
  </div>

  <div class="menu-backdrop" id="menuBackdrop" hidden></div>
  <aside class="home-drawer" id="homeDrawer" hidden aria-hidden="true" aria-label="Menu">
    <div class="home-drawer-head">
      <p class="home-drawer-title">Menu</p>
      <button type="button" class="menu-close" id="menuClose" aria-label="Close menu">×</button>
    </div>
    <nav class="home-drawer-nav">
      <a class="drawer-link" id="loginLink" href="login.html">Account</a>
      <a class="drawer-link" id="profileLink" href="profile-setup.html" hidden>Profile</a>
      <a class="drawer-link" id="storeLink" href="store.html">Boutique</a>
      <a class="drawer-link" id="robloxDrawerLink" href="roblox.html">Play on Roblox</a>
      <a class="drawer-link" id="waitlistLink" href="waitlist.html">Test pilot</a>
      <a class="drawer-link" href="pitch.html">Pitch deck</a>
      <button type="button" class="drawer-link drawer-link-btn" id="logoutBtn" hidden>Sign out</button>
    </nav>
  </aside>

  <script src="auth-client.js"></script>
  <script src="roblox-play.js"></script>
  <script src="quick-run.js"></script>
  <script src="script.js"></script>
  <script src="intro.js?v=18"></script>
</body>
</html>
