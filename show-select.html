<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Rascal Runways - Pick Your Show</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container map-select-bg">
            <div class="page-nav">
                <a href="map-select.html" class="game-btn back-btn"><span class="btn-text">City</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Walk For</h1>
                <p class="map-subtitle" id="citySubtitle">Choose the designer show</p>
            </div>
            <div class="difficulty-panel">
                <p class="difficulty-label">Power Scale</p>
                <div class="difficulty-options" id="difficultyOptions" role="radiogroup" aria-label="Difficulty">
                </div>
                <p class="difficulty-hint" id="difficultyHint">Medium — balanced runway pace</p>
            </div>
            <div class="map-selection" id="showList"></div>
            <div class="game-footer">
                <a href="map-select.html" class="game-btn back-btn">
                    <span class="btn-text">City</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmShowBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Start Walk</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="shows-data.js"></script>
    <script src="show-select.js"></script>
</body>
</html>
