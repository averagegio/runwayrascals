<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals - Select Wardrobe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container wardrobe-select-bg">
            <div class="page-nav">
                <a href="character-select.html" class="game-btn back-btn"><span class="btn-text">Back</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Select Outfit</h1>
            </div>
            <div class="character-display">
                <img id="selectedCharacter" src="" alt="Selected Character">
            </div>
            <div class="wardrobe-tabs">
                <button class="tab-btn active" data-tab="outfits">Outfits</button>
                <button class="tab-btn" data-tab="walk">Walk</button>
                <button class="tab-btn" data-tab="designers">Shop Designers</button>
            </div>
            <div class="wardrobe-selection">
                <div id="outfits" class="tab-content active">
                    <div class="outfit-options">
                        <!-- Outfit options will be dynamically added here -->
                    </div>
                </div>
                <div id="walk" class="tab-content">
                    <p class="walk-hint">Choose how your model walks the runway</p>
                    <div class="gait-options" id="gaitOptions"></div>
                </div>
                <div id="designers" class="tab-content">
                    <div class="designer-options">
                        <!-- Designer options will be dynamically added here -->
                    </div>
                </div>
            </div>
            <div class="game-footer">
                <a href="character-select.html" class="game-btn back-btn">
                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmOutfitBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Confirm</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="wardrobe-select.js"></script>
</body>
</html>
