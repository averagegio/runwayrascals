<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Rascal Runways - Select Wardrobe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="app-container wardrobe-select-bg">
            <div class="page-nav">
                <a href="character-create.html" class="game-btn back-btn"><span class="btn-text">Back</span></a>
                <a href="store.html" class="game-btn"><span class="btn-text">Checkout</span></a>
            </div>
            <div class="game-header">
                <h1 class="game-title">Select Outfit</h1>
                <p class="map-subtitle" id="wardrobeSubtitle">Logo looks · member unlocks</p>
            </div>
            <div class="character-display" id="characterDisplay">
                <img id="selectedCharacter" src="" alt="Selected Character">
                <canvas id="walkPreview" width="220" height="320" aria-label="Walk preview" hidden></canvas>
                <p class="walk-preview-label" id="walkPreviewLabel" hidden>Side profile · walking</p>
            </div>
            <div class="wardrobe-tabs">
                <button class="tab-btn active" data-tab="outfits">Looks</button>
                <button class="tab-btn" data-tab="walk">Walk</button>
                <button class="tab-btn" data-tab="designers">Shop &amp; Checkout</button>
            </div>
            <div class="wardrobe-selection">
                <div id="outfits" class="tab-content active">
                    <p class="walk-hint">Open logo pieces · locked looks need a member account</p>
                    <div class="outfit-options" id="outfitOptions"></div>
                </div>
                <div id="walk" class="tab-content">
                    <p class="walk-hint">360° orbit — front · side · back as you slide</p>
                    <div class="walk-model-toggle" id="walkModelToggle" role="group" aria-label="Model">
                        <button type="button" class="model-toggle-btn" data-model="female">Female</button>
                        <button type="button" class="model-toggle-btn" data-model="male">Male</button>
                    </div>
                    <div class="orbit-slider-wrap">
                        <label class="orbit-label" for="orbitSlider">
                            <span id="orbitAngleLabel">Front</span>
                            <span id="orbitDegLabel">0°</span>
                        </label>
                        <input type="range" id="orbitSlider" min="0" max="360" value="90" step="1" aria-label="360 orbit" />
                        <div class="orbit-ticks" aria-hidden="true">
                            <span>Front</span><span>Side</span><span>Back</span><span>Side</span><span>Front</span>
                        </div>
                    </div>
                    <div class="gait-options" id="gaitOptions"></div>
                </div>
                <div id="designers" class="tab-content">
                    <p class="walk-hint">Members unlock locked pieces at checkout</p>
                    <div class="designer-options" id="designerOptions"></div>
                    <p class="store-inline-status" id="shopStatus" hidden></p>
                </div>
            </div>
            <div class="game-footer">
                <a href="character-create.html" class="game-btn back-btn">
                    <span class="btn-text">Back</span>
                    <span class="btn-shine"></span>
                </a>
                <a href="#" id="confirmOutfitBtn" class="game-btn confirm-btn">
                    <span class="btn-text">Confirm</span>
                    <span class="btn-shine"></span>
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="auth-client.js"></script>
    <script src="designer-sets.js"></script>
    <script src="character-3d.js?v=create1"></script>
    <script src="wardrobe-select.js?v=orbit1"></script>
</body>
</html>
