<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070708" />
    <title>Runway Rascals - Runway Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="phone-frame">
        <div class="app-container gameplay-bg" id="gameRoot">
            <div class="runway-hud">
                <button type="button" id="exitGameBtn" class="game-btn back-btn hud-back" aria-label="Pause or exit">
                    <span class="btn-text">Exit</span>
                    <span class="btn-shine"></span>
                </button>
                <div class="hud-center">
                    <div id="mapLabel" class="hud-map-label">Fashion Week</div>
                    <div id="showLabel" class="hud-show-label">Walking for…</div>
                    <div id="playerTag" class="hud-player-tag">@model</div>
                    <div id="difficultyDisplay" class="hud-difficulty">Medium</div>
                    <div id="scoreDisplay" class="hud-score">0</div>
                    <div id="goalDisplay" class="hud-goal">RARE: 0/3</div>
                    <div id="collectDisplay" class="hud-collect">Looks: 0</div>
                </div>
                <button type="button" id="cameraToggleBtn" class="game-btn camera-toggle-btn" aria-label="Flip camera">
                    <span class="btn-text" id="cameraToggleLabel">Front Cam</span>
                    <span class="btn-shine"></span>
                </button>
            </div>
            <div class="outfit-hud">
                <div id="boostDisplay" class="hud-boost">Boost</div>
                <div id="outfitDisplay" class="hud-outfit">Nameless Street</div>
                <div id="wardrobeTrack" class="wardrobe-track" aria-label="Outfit pieces"></div>
            </div>
            <div id="gameWrapper">
                <canvas id="gameCanvas"></canvas>
                <canvas id="avatar3d" width="200" height="280" aria-hidden="true"></canvas>
                <div id="swipeHint" class="swipe-hint">3D model · collect looks to get dressed</div>
            </div>
            <div id="controlsWrapper">
                <div id="mobileControls">
                    <button id="leftArrow" class="control-btn" aria-label="Lane left">&#9668;</button>
                    <button id="upArrow" class="control-btn" aria-label="Jump">&#9650;</button>
                    <button id="downArrow" class="control-btn" aria-label="Slide">&#9660;</button>
                    <button id="rightArrow" class="control-btn" aria-label="Lane right">&#9658;</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="auth-client.js"></script>
    <script src="shows-data.js"></script>
    <script src="fashion-items.js"></script>
    <script src="character-3d.js"></script>
    <script src="level-cinematic.js"></script>
    <script src="gameplay.js"></script>
</body>
</html>
